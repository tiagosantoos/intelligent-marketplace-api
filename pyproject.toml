[project]
name = "intelligent-marketplace-api"
version = "0.1.0"
description = "Backend da solução Intelligent Marketplace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
marketplace-import = "intelligent_marketplace.importing.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_marketplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exige um PostgreSQL real configurado explicitamente"]
