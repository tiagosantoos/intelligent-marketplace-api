[project]
name = "intelligent-marketplace-api"
version = "0.1.0"
description = "Backend da solução Intelligent Marketplace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligent_marketplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
